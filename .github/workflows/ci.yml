name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Run the same build on every runner; one failure must not hide the rest.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-26.04-arm
          - macos-latest
          - macos-26-intel
          - windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # run.sh owns setup: it installs the native Fyne dependencies for the OS.
      - name: Install dependencies
        run: ./run.sh dependencies

      # The same build command on every runner (CLI everywhere, plus the GUI
      # on Linux/Windows and the .app bundle on macOS).
      - name: Build
        run: ./run.sh build

      # upload-artifact drops the executable bit (files come back 644), which
      # would break the binaries and the .app bundle, so package them as
      # tarballs first; tar preserves the permissions and the bundle layout.
      - name: Package binaries
        run: |
          mkdir -p dist
          tar -czf "dist/guacamole-cli-${{ matrix.os }}.tar.gz" -C .build/cli .
          gui_dir=".build/gui"
          if [ -d .build/macos ]; then
            gui_dir=".build/macos"
          fi
          tar -czf "dist/guacamole-gui-${{ matrix.os }}.tar.gz" -C "${gui_dir}" .

      - name: Upload CLI binaries
        uses: actions/upload-artifact@v4
        with:
          name: guacamole-cli-${{ matrix.os }}
          path: dist/guacamole-cli-${{ matrix.os }}.tar.gz
          if-no-files-found: error

      - name: Upload GUI
        uses: actions/upload-artifact@v4
        with:
          # Linux/Windows GUI binaries; macOS packages the Guacamole.app bundle.
          name: guacamole-gui-${{ matrix.os }}
          path: dist/guacamole-gui-${{ matrix.os }}.tar.gz
          if-no-files-found: error
